[project]
name = "canawler"
version = "0.1.0"
description = "Track running, biking, and hiking coverage of the C&O Canal towpath"
readme = "README.md"
authors = [
    { name = "cak", email = "cak@typeerror.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fitdecode>=0.11.0",
    "geopandas>=1.1.1",
    "numpy>=2.4.6",
    "plotnine>=0.15.0",
    "polars>=1.44.1",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
]

[project.scripts]
canawler = "canawler:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "great-tables>=0.24.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "ruff>=0.16.5",
]
